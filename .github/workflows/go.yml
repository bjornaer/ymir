name: Go

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, vet, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./compiler)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: build
        run: go build -o bin/ymir ./cmd/ymir

      # Phase 1 exit criterion: every conformance case is syntactically valid.
      - name: parse every conformance case
        run: |
          fail=0
          for f in $(find conformance/cases -name '*.ymr' | sort); do
            if ! ./bin/ymir parse -q "$f"; then
              echo "::error file=$f::case does not parse"
              fail=1
            fi
          done
          exit $fail

      # Phase 2 exit criterion. The authoritative gate is
      # TestConformanceCasesCheck, which asserts the line and column of every
      # expected diagnostic -- run.py checks neither. This loop covers the other
      # half at the CLI: a case with no `compile-error` header must check clean,
      # and `ymir check` must exit 0 for it.
      - name: type-check every case that is meant to compile
        run: |
          fail=0
          for f in $(find conformance/cases -name '*.ymr' | sort); do
            if grep -q '^#@ compile-error' "$f"; then
              continue
            fi
            case "$f" in
              */quantum/no_cloning.ymr|*/quantum/qreg_register.ymr)
                continue ;;   # gate names are unresolved; see open question Q14
            esac
            if ! ./bin/ymir check -q "$f"; then
              echo "::error file=$f::case must type-check but does not"
              fail=1
            fi
          done
          exit $fail

      - name: type-check the tour
        run: ./bin/ymir check -q examples/tour.ymr
